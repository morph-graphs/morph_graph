# MERIT environment images (baselines/merit/docker/Dockerfile), one per arm, for runs outside our clusters.
# The org's private repos share 2,000 Actions minutes a month and a build is ~20-30 min per arm, so:
# - pull_request touching the image's files: build both arms, push nothing (does it still build?);
# - workflow_dispatch on main: build and publish ghcr.io/morph-graphs/merit:<arm>-<env hash>,
#   skipping an arm whose tag already exists (baselines/merit/docker/image_tag.sh; code-only commits
#   keep the same tag, so they need no new image).
name: merit-images

on:
  pull_request:
    paths:
      - baselines/merit/env/**
      - baselines/merit/docker/**
      - .github/workflows/merit-images.yml
  workflow_dispatch:

concurrency:
  group: merit-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arm: [m8, m27]
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        id: tag
        run: echo "image=ghcr.io/morph-graphs/merit:$(bash baselines/merit/docker/image_tag.sh ${{ matrix.arm }})" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Already published?
        id: have
        if: env.PUBLISH == 'true'
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "${{ steps.tag.outputs.image }} exists; nothing to build"
          fi
      - name: Free disk (the CUDA base image is ~10 GB)
        if: steps.have.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null; df -h /
      - name: Build
        if: steps.have.outputs.skip != 'true'
        run: |
          docker build -f baselines/merit/docker/Dockerfile --build-arg ARM=${{ matrix.arm }} \
            --build-arg COMMIT=$(git rev-parse --short HEAD) -t "${{ steps.tag.outputs.image }}" .
      - name: Push
        if: env.PUBLISH == 'true' && steps.have.outputs.skip != 'true'
        run: docker push "${{ steps.tag.outputs.image }}"
